server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # The original Medialytics page; the Cast & Crew page is the default at /
    location = /official {
        try_files /official.html =404;
    }
    location = /official/ {
        return 301 /official;
    }

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
}
